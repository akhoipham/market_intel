name: Update dashboard

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "7 6 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --- restore the accumulated DB from the previous run's release asset ---
      - name: Restore intel.db
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download data-snapshot --pattern intel.db --dir data --clobber 2>/dev/null; then
            echo "restored $(du -h data/intel.db | cut -f1) database"
          else
            echo "no snapshot yet — starting a fresh database"
          fi

      - name: Weekly ticker refresh (Sundays only)
        if: github.event.schedule == '7 6 * * 0'
        run: python run.py refresh-tickers

      - name: Fetch feeds and build dashboard
        run: python run.py fetch build

      # --- store the DB outside git; 2 GB per asset, zero repo bloat ---
      - name: Save intel.db snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-snapshot >/dev/null 2>&1 || \
            gh release create data-snapshot --title "Data snapshot" \
              --notes "Rolling intel.db. Replaced on every run; not part of git history."
          gh release upload data-snapshot data/intel.db --clobber

      - name: Commit dashboard
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "auto: refresh $(date -u +'%Y-%m-%d %H:%M UTC')" \
            || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            # NOTE: during a rebase "theirs" = the commits being replayed = ours.
            git pull --rebase -X theirs --autostash && git push && exit 0
            echo "push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "::error::push failed after 5 attempts"
          exit 1
